apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-example
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kkkksu/go-example.git
    path: k8s
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: go-example
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
